services:
  # Backend API
  - type: web
    name: satoshishuttle-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: satoshishuttle-db
          property: connectionString

  # Frontend (Static Site)
  - type: web
    name: satoshishuttle-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://satoshishuttle-backend.onrender.com/api

databases:
  - name: satoshishuttle-db
    databaseName: satoshishuttle
    user: satoshishuttle
    plan: free
